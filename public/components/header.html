<!-- components/header.html — Header com logo, XP e tema -->
<!-- Header -->

<div class="header">
  <div class="logo">
    <div class="logo-icon">🚀</div>
    <div class="logo-text">Voa<span>AM</span></div>
  </div>
  <div class="header-right">
    <div class="header-xp" id="xp-display">⭐ <span id="xp-count">0</span> XP</div>
    <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" title="Alternar tema" aria-label="Alternar tema">
      <span class="theme-toggle-label theme-toggle-label-light">☀️ CLARO</span>
      <span class="theme-toggle-label theme-toggle-label-dark">🌙 ESCURO</span>
    </button>
  </div>
</div>
