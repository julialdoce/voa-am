<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voa AM — Vestibulares do Amazonas</title>
  <meta name="description" content="Plataforma gratuita de estudos para PSC (UFAM), SIS (UEA), MACRO (UEA) e ENEM. Simulados, exercícios e banco de questões do Amazonas.">
  <meta name="theme-color" content="#0f1117">
  <meta property="og:title" content="Voa AM — Vestibulares do Amazonas">
  <meta property="og:description" content="Simulados, exercícios e banco de questões para PSC, SIS, MACRO e ENEM.">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦅</text></svg>">

  <!-- ── Fontes ── -->
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Fraunces:ital,wght@0,700;0,900;1,700&display=swap" rel="stylesheet">

  <!-- ── CSS Base (tokens, reset, layout móvel) ── -->
  <link rel="stylesheet" href="css/style.css">

  <!-- ── CSS Modular ──
       components.css  → sim-card, ex-lista, badges reutilizáveis
       auth.css        → login e cadastro
       responsive.css  → sidebar desktop e breakpoints
  ── -->
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<!-- AUTH OVERLAY ─────────────────────────────────────────────
     Edite HTML → pages/auth.html
     Edite CSS  → css/auth.css
     Edite JS   → js/modules/auth.js
     Nota: auth.html já contém o <div id="auth-wrapper"> completo.
     O Router usa outerHTML para substituir este placeholder.
──────────────────────────────────────────────────────────── -->
<div id="auth-wrapper"></div>

<!-- APP ──────────────────────────────────────────────────────
     Layout principal: header + sidebar/nav + conteúdo
──────────────────────────────────────────────────────────── -->
<div id="app-wrapper">

  <!-- components/header.html -->
  <div id="slot-header"></div>

  <!-- components/toasts.html (XP toast + achievement popup) -->
  <div id="slot-toasts"></div>

  <!-- ── PÁGINAS ────────────────────────────────────────────
       Uma por vez (.active).  Navegação: goTo('nome')
       pages/home.html          → Início
       pages/materia.html       → Estudar (matéria + tópicos)
       pages/praticar.html      → Praticar (simulados + exercícios)
       pages/perfil.html        → Perfil do aluno
  ──────────────────────────────────────────────────────────── -->
  <div id="slot-page-home"></div>
  <div id="slot-page-materia"></div>
  <div id="slot-page-praticar"></div>
  <div id="slot-page-redacao"></div>   <!-- pages/redacao.html -->
  <div id="slot-page-perfil"></div>
  <div id="slot-page-banco-de-provas"></div>

  <!-- ── OVERLAYS ───────────────────────────────────────────
       Ficam sobre tudo quando ativos (position: fixed).
       components/aula-view.html        → quiz + videoaula
       components/exercicios-view.html  → exercícios duolingo
       components/bloqueado-view.html   → sem corações
  ──────────────────────────────────────────────────────────── -->
  <div id="slot-aula-view"></div>
  <div id="slot-exercicios-view"></div>
  <div id="slot-bloqueado-view"></div>

  <!-- components/navbar.html (bottom-nav móvel / sidebar desktop) -->
  <div id="slot-navbar"></div>

</div><!-- /app-wrapper -->

<!-- Simulado Completo — fora do app-wrapper para não ser afetado pelo grid -->
<div id="slot-sc-view"></div>


<!-- ROUTER ───────────────────────────────────────────────────
     Injeta fragmentos e carrega módulos JS em ordem.
     Adicionar página: 1) crie pages/nova.html
                       2) adicione entrada em fragments abaixo
                       3) adicione case em js/modules/nav.js → goTo()
──────────────────────────────────────────────────────────── -->
<script>
const Router = {

  fragments: {
    'auth-wrapper':           'pages/auth.html',
    'slot-header':            'components/header.html',
    'slot-toasts':            'components/toasts.html',
    'slot-navbar':            'components/navbar.html',
    'slot-aula-view':         'components/aula-view.html',
    'slot-exercicios-view':   'components/exercicios-view.html',
    'slot-bloqueado-view':    'components/bloqueado-view.html',
    'slot-sc-view':           'components/simulado-completo-view.html',
    'slot-page-home':         'pages/home.html',
    'slot-page-materia':      'pages/materia.html',
    'slot-page-praticar':     'pages/praticar.html',
    'slot-page-redacao':      'pages/redacao.html',
    'slot-page-perfil':       'pages/perfil.html',
    'slot-page-banco-de-provas': 'pages/banco-de-provas.html',
  },

  // Ordem estrita de dependência — NÃO reordene sem revisar
  scripts: [
    'js/modules/state.js',        // estado, perfil, corações
    'js/data/topics.js',          // mathTopics, redTopics
    'js/data/quizzes.js',         // quizzes por tópico
    'js/data/simulados.js',       // simuladoQuestions + catalogoSimulados
    'js/data/banco.js',           // bancoDB (questões reais)
    'js/modules/utils.js',        // getDificuldade + pós-proc
    'js/modules/gamification.js', // XP, streak, achievements
    'js/modules/materia.js',      // tela Estudar
    'js/modules/aula.js',         // aula + quiz
    'js/modules/simulado.js',     // simulado cronometrado
    'js/modules/praticar.js',     // aba Praticar
    'js/modules/exercicios-assuntos.js', // assuntos → nível → questões (extraído de script.js)
    'js/modules/exercicios.js',   // exercícios Duolingo
    'js/modules/auth.js',         // login/cadastro
    'js/data/enem2025_mat.js',    // questões ENEM 2025 matemática
    'js/data/enem2024_mat.js',    // questões ENEM 2024 matemática
    'js/data/enem2023_mat.js',    // questões ENEM 2023 matemática
    'js/data/macro2025_mat.js',   // questões MACRO 2025 matemática
    'js/data/macro2024_mat.js',   // questões MACRO 2024 matemática
    'js/data/macro2023_mat.js',   // questões MACRO 2023 matemática
    'js/data/psc1_mat.js',        // questões PSC 1ª Etapa (2023–2025)
    'js/data/psc2_mat.js',        // questões PSC 2ª Etapa (2023–2025)
    'js/data/psc3_mat.js',        // questões PSC 3ª Etapa (2023–2025)
    'js/data/sis1_mat.js',        // questões SIS 1ª Etapa (2023–2025)
    'js/data/sis2_mat.js',        // questões SIS 2ª Etapa (2023–2025)
    'js/data/sis3_mat.js',        // questões SIS 3ª Etapa (2023–2025)
    'js/modules/banco-provas.js',      // tela Banco de Provas
    'js/modules/simulado_completo.js', // simulado completo
    'js/modules/redacao.js',      // página de redação
    'js/modules/nav.js',          // goTo, perfil, tema
    'js/app.js',                  // init final
  ],

  async loadFragment(id, url) {
    const el = document.getElementById(id);
    if (!el) return;
    try {
      const r = await fetch(url);
      if (!r.ok) throw new Error(`${r.status} ${url}`);
      const html = await r.text();
      // auth.html já contém o próprio <div id="auth-wrapper">,
      // então substituímos o elemento inteiro em vez de injetar dentro dele.
      if (id === 'auth-wrapper') {
        el.outerHTML = html;
      } else {
        el.innerHTML = html;
      }
    } catch (e) {
      console.warn('[VoaAM] fragmento falhou:', e.message);
    }
  },

  loadScript(src) {
    return new Promise(res => {
      const s = document.createElement('script');
      s.src = src;
      s.onload  = res;
      s.onerror = () => { console.warn('[VoaAM] script falhou:', src); res(); };
      document.body.appendChild(s);
    });
  },

  async boot() {
    await Promise.all(Object.entries(this.fragments).map(([id, url]) => this.loadFragment(id, url)));
    for (const src of this.scripts) await this.loadScript(src);
  }
};

Router.boot();
</script>

</body>
</html>
