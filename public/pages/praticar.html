<!-- pages/praticar.html — Abas de Simulados e Exercícios -->
<!-- ========== TREINO ========== -->
<!-- ========== PRATICAR ========== -->
<div class="screen" id="screen-praticar">
  <div style="padding:20px 20px 10px">
    <div style="font-family:var(--font-display);font-size:22px;font-weight:900;margin-bottom:2px;letter-spacing:-0.5px">⚡ Praticar</div>
    <div style="font-size:13px;color:var(--text2);margin-bottom:16px">Questões reais dos vestibulares do Amazonas</div>

    <!-- Tabs Simulados / Exercícios -->
    <div style="display:flex;gap:6px;margin-bottom:16px">
      <button id="pratab-sim" onclick="pratAba('sim')" style="flex:1;padding:10px 8px;border-radius:12px;border:1.5px solid var(--border-accent);background:rgba(59,130,246,0.1);color:var(--accent2);font-family:var(--font);font-size:13px;font-weight:700;cursor:pointer">🎯 Simulados</button>
      <button id="pratab-ex" onclick="pratAba('ex')" style="flex:1;padding:10px 8px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--text2);font-family:var(--font);font-size:13px;font-weight:600;cursor:pointer">⚡ Exercícios</button>
    </div>

    <!-- Painel Simulados -->
    <div id="prat-sim-panel">

      <!-- Abas Simples / Completo -->
      <div style="display:flex;gap:8px;margin-bottom:18px" id="sim-modo-tabs">
        <button id="simtab-simples" onclick="simModoAba('simples',this)" style="
          flex:1;padding:14px 10px;border-radius:14px;
          border:1.5px solid var(--border-accent);
          background:rgba(59,130,246,0.12);
          color:var(--accent2);font-family:var(--font);font-size:14px;font-weight:700;cursor:pointer;
          display:flex;flex-direction:column;align-items:center;gap:4px;transition:all 0.2s">
          <span style="font-size:22px">⚡</span>
          <span>Simulado Simples</span>
          <span style="font-size:10px;font-weight:500;opacity:0.75">Metade das questões e tempo</span>
        </button>
        <button id="simtab-completo" onclick="simModoAba('completo',this)" style="
          flex:1;padding:14px 10px;border-radius:14px;
          border:1px solid var(--border);
          background:var(--surface);
          color:var(--text2);font-family:var(--font);font-size:14px;font-weight:700;cursor:pointer;
          display:flex;flex-direction:column;align-items:center;gap:4px;transition:all 0.2s">
          <span style="font-size:22px">🏆</span>
          <span>Simulado Completo</span>
          <span style="font-size:10px;font-weight:500;opacity:0.75">Prova oficial completa</span>
        </button>
      </div>

      <!-- Picker de vestibular (aparece após escolher o modo) -->
      <div id="sim-vest-picker" style="display:none">
        <div style="font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:10px" id="sim-vest-picker-label">Escolha o vestibular</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px" id="sim-vest-picker-grid"></div>
      </div>

      <!-- Cards do simulado selecionado -->
      <div id="sim-cards-container" style="margin-top:4px"></div>
    </div>

    <!-- Painel Exercícios -->
    <div id="prat-ex-panel" style="display:none">

      <!-- ETAPA 1: Grade de assuntos -->
      <div id="ex-assuntos-panel">
        <div style="font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:10px">📚 Escolha um assunto</div>
        <div id="ex-assuntos-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:8px"></div>
      </div>

      <!-- ETAPA 2: Seletor de nível -->
      <div id="ex-nivel-panel" style="display:none">
        <button onclick="exVoltarAssuntos()" style="display:flex;align-items:center;gap:6px;margin-bottom:14px;background:none;border:none;color:var(--text2);font-family:var(--font);font-size:13px;cursor:pointer;padding:0">← Voltar</button>
        <div id="ex-nivel-header" style="display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;margin-bottom:14px;border:1px solid var(--border)"></div>
        <div style="font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:10px">Escolha o nível de dificuldade</div>
        <div style="display:flex;flex-direction:column;gap:8px">
          <button onclick="exSelecionarNivel(1)" style="padding:16px;border-radius:14px;border:1px solid rgba(34,197,94,0.3);background:rgba(34,197,94,0.08);color:var(--text);font-family:var(--font);cursor:pointer;text-align:left;display:flex;align-items:center;gap:14px;transition:all 0.15s">
            <span style="font-size:24px">🟢</span>
            <div><div style="font-size:14px;font-weight:700;color:#22c55e">Fácil</div><div style="font-size:11px;color:var(--text2);margin-top:2px">Conceitos básicos e contas diretas</div></div>
          </button>
          <button onclick="exSelecionarNivel(2)" style="padding:16px;border-radius:14px;border:1px solid rgba(245,158,11,0.3);background:rgba(245,158,11,0.08);color:var(--text);font-family:var(--font);cursor:pointer;text-align:left;display:flex;align-items:center;gap:14px;transition:all 0.15s">
            <span style="font-size:24px">🟡</span>
            <div><div style="font-size:14px;font-weight:700;color:var(--amber)">Médio</div><div style="font-size:11px;color:var(--text2);margin-top:2px">Interpretação e aplicação de fórmulas</div></div>
          </button>
          <button onclick="exSelecionarNivel(3)" style="padding:16px;border-radius:14px;border:1px solid rgba(239,68,68,0.3);background:rgba(239,68,68,0.08);color:var(--text);font-family:var(--font);cursor:pointer;text-align:left;display:flex;align-items:center;gap:14px;transition:all 0.15s">
            <span style="font-size:24px">🔴</span>
            <div><div style="font-size:14px;font-weight:700;color:var(--red)">Difícil</div><div style="font-size:11px;color:var(--text2);margin-top:2px">Questões de vestibular de alta complexidade</div></div>
          </button>
        </div>
      </div>

      <!-- ETAPA 3: Lista de questões -->
      <div id="ex-questoes-panel" style="display:none">
        <button onclick="exVoltarNivel()" style="display:flex;align-items:center;gap:6px;margin-bottom:14px;background:none;border:none;color:var(--text2);font-family:var(--font);font-size:13px;cursor:pointer;padding:0">← Voltar</button>
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
          <div style="font-size:12px;color:var(--text2)" id="ex-lista-info"></div>
          <button onclick="exAtualizarQuestoes()" style="display:flex;align-items:center;gap:5px;padding:7px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-family:var(--font);font-size:11px;font-weight:700;cursor:pointer">🔄 Atualizar</button>
        </div>
        <div id="ex-lista-10"></div>
      </div>

    </div>
  </div>
</div>
